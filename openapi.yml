openapi: "3.0.3"
info:
  title: コンビニトイレマップ API
  description: |
    コンビニのトイレ位置情報を共有・検索するWebアプリケーションのAPI。
    認証はフロントから Cognito SDK を直接利用。
    バックエンドは API Gateway の Cognito Authorizer で JWT を検証。
  version: "1.0.0"

servers:
  - url: https://api.example.com/v1
    description: Production (API Gateway + Lambda)

tags:
  - name: toilets
    description: トイレ情報の登録・取得
  - name: images
    description: 画像アップロード

paths:
  # ============================================================
  # 画像アップロード（S3 presigned URL 発行）
  # ============================================================
  /images/presigned-url:
    post:
      tags: [images]
      summary: S3 presigned URL を発行
      operationId: createPresignedUrl
      security:
        - cognitoAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignedUrlRequest"
      responses:
        "200":
          description: presigned URL 発行成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignedUrlResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ============================================================
  # トイレ情報
  # ============================================================
  /toilets:
    post:
      tags: [toilets]
      summary: トイレ情報を投稿
      description: |
        コンビニの店舗情報とトイレ情報をまとめて投稿する。
        画像は事前に S3 へアップロードし、取得した imageKey を指定する。
      operationId: createToilet
      security:
        - cognitoAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateToiletRequest"
      responses:
        "201":
          description: 投稿成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Toilet"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags: [toilets]
      summary: 指定範囲内のトイレ一覧を取得（マップ表示用）
      operationId: listToilets
      security:
        - cognitoAuth: []
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
          description: 中心緯度
        - name: lng
          in: query
          required: true
          schema:
            type: number
            format: double
          description: 中心経度
        - name: radius
          in: query
          required: false
          schema:
            type: integer
            default: 1000
            minimum: 100
            maximum: 5000
          description: 検索半径（メートル）
      responses:
        "200":
          description: トイレ一覧
          content:
            application/json:
              schema:
                type: object
                required: [toilets]
                properties:
                  toilets:
                    type: array
                    items:
                      $ref: "#/components/schemas/Toilet"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /toilets/{toiletId}:
    get:
      tags: [toilets]
      summary: トイレ詳細を取得
      operationId: getToilet
      security:
        - cognitoAuth: []
      parameters:
        - $ref: "#/components/parameters/toiletId"
      responses:
        "200":
          description: トイレ詳細
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Toilet"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  # ============================================================
  # セキュリティスキーム
  # ============================================================
  securitySchemes:
    cognitoAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Amazon Cognito が発行する ID Token / Access Token

  # ============================================================
  # パラメータ
  # ============================================================
  parameters:
    toiletId:
      name: toiletId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: トイレID

  # ============================================================
  # 共通レスポンス
  # ============================================================
  responses:
    BadRequest:
      description: リクエスト不正
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 認証エラー
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: リソースが見つからない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  # ============================================================
  # スキーマ
  # ============================================================
  schemas:
    # --- 共通 ---
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: "VALIDATION_ERROR"
        message:
          type: string
          example: "リクエストが不正です"

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: "処理が完了しました"

    # --- 画像 ---
    PresignedUrlRequest:
      type: object
      required: [contentType]
      properties:
        contentType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
          description: アップロードする画像のMIMEタイプ

    PresignedUrlResponse:
      type: object
      required: [uploadUrl, imageKey, expiresIn]
      properties:
        uploadUrl:
          type: string
          format: uri
          description: S3 presigned PUT URL
        imageKey:
          type: string
          description: S3オブジェクトキー（投稿時に指定）
        expiresIn:
          type: integer
          description: URL有効期限（秒）
          example: 300

    # --- トイレ ---
    CreateToiletRequest:
      type: object
      required:
        - name
        - brand
        - lat
        - lng
        - imageKey
        - maleCount
        - femaleCount
        - multipurposeCount
        - requiresPermission
      properties:
        name:
          type: string
          description: コンビニ店舗名
          example: "セブン-イレブン 渋谷駅前店"
        brand:
          type: string
          enum:
            - seven_eleven
            - family_mart
            - lawson
            - mini_stop
            - daily_yamazaki
            - other
          description: コンビニブランド
        address:
          type: string
          description: 住所
        lat:
          type: number
          format: double
          description: 緯度
        lng:
          type: number
          format: double
          description: 経度
        imageKey:
          type: string
          description: S3にアップロード済みの画像キー
        maleCount:
          type: integer
          minimum: 0
          description: 男性用トイレ個数
        femaleCount:
          type: integer
          minimum: 0
          description: 女性用トイレ個数
        multipurposeCount:
          type: integer
          minimum: 0
          description: 多目的トイレ個数
        requiresPermission:
          type: boolean
          description: 店員への使用許可が必要か
        note:
          type: string
          maxLength: 500
          description: その他自由記入欄

    Toilet:
      type: object
      required:
        - toiletId
        - name
        - brand
        - lat
        - lng
        - imageUrl
        - maleCount
        - femaleCount
        - multipurposeCount
        - requiresPermission
        - createdAt
      properties:
        toiletId:
          type: string
          format: uuid
        name:
          type: string
          description: コンビニ店舗名
          example: "セブン-イレブン 渋谷駅前店"
        brand:
          type: string
          enum:
            - seven_eleven
            - family_mart
            - lawson
            - mini_stop
            - daily_yamazaki
            - other
        address:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        imageUrl:
          type: string
          format: uri
          description: トイレ画像URL
        maleCount:
          type: integer
          minimum: 0
        femaleCount:
          type: integer
          minimum: 0
        multipurposeCount:
          type: integer
          minimum: 0
        requiresPermission:
          type: boolean
        note:
          type: string
        createdBy:
          type: string
          description: 投稿者ユーザーID
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
