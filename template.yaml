AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: コンビニトイレマップ API

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: provided.al2023
    Architectures:
      - arm64

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: bootstrap
      CodeUri: .
      Environment:
        Variables:
          S3_BUCKET_NAME: neptune-toilet-images
          VAPID_PUBLIC_KEY: !Ref VapidPublicKey
          VAPID_PRIVATE_KEY: !Ref VapidPrivateKey
          ROUTE_CALCULATOR_NAME: !Ref RouteCalculator
          BEDROCK_REGION: us-east-1
      Policies:
        - DynamoDBCrudPolicy:
            TableName: ToiletsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ReportsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscriptionsTable
        - S3CrudPolicy:
            BucketName: neptune-toilet-images
        - Statement:
            - Effect: Allow
              Action: geo:CalculateRoute
              Resource: !GetAtt RouteCalculator.Arn
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: "arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-3-haiku-20240307-v1:0"
      Events:
        CatchAll:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY

    Metadata:
      BuildMethod: makefile

  SubscriptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SubscriptionsTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: subscriptionId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: subscriptionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: userId-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  ReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ReportsTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: toiletId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: toiletId
          KeyType: HASH
        - AttributeName: userId
          KeyType: RANGE

  RouteCalculator:
    Type: AWS::Location::RouteCalculator
    Properties:
      CalculatorName: neptune-route-calculator
      DataSource: Here
      Description: Neptune walking route calculator

Parameters:
  VapidPublicKey:
    Type: String
    Default: ""
    Description: VAPID public key for Web Push
  VapidPrivateKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: VAPID private key for Web Push

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
